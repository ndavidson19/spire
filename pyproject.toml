[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spire"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.baml]
generate-path = "src/spire/generated"
schemas-path = "schemas"
