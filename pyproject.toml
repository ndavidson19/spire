requires-python = ">=3.10,<3.11"
dependencies = ["annotated-types>=0.7.0", "attrs>=24.3.0", "baml-py>=0.73.4", "beautifulsoup4>=4.12.3", "certifi>=2024.12.14", "charset-normalizer>=3.4.1", "click>=8.1.8", "coloredlogs>=15.0.1", "contourpy>=1.3.1", "cycler>=0.12.1", "dataclasses-json>=0.6.7", "deepsearch-glm>=0.24.0", "deepsearch-toolkit>=1.0.1", "dill>=0.3.9", "docling>=1.7.1", "docling-core>=1.7.2", "docling-ibm-models>=1.3.3", "docling-parse>=1.6.2", "docutils>=0.21.2", "easyocr>=1.7.2", "et-xmlfile>=2.0.0", "exceptiongroup>=1.2.2", "filelock>=3.17.0", "filetype>=1.2.0", "flatbuffers>=25.1.21", "fonttools>=4.55.5", "fsspec>=2024.12.0", "huggingface-hub>=0.27.1", "humanfriendly>=10.0", "idna>=3.10", "imageio>=2.37.0", "iniconfig>=2.0.0", "jinja2>=3.1.5", "json-schema-for-humans>=1.3.4", "jsonlines>=3.1.0", "jsonref>=1.1.0", "jsonschema>=4.23.0", "jsonschema-specifications>=2024.10.1", "kiwisolver>=1.4.8", "lazy-loader>=0.4", "lxml>=4.9.4", "markdown-it-py>=3.0.0", "markdown2>=2.5.2", "marko>=2.1.2", "markupsafe>=3.0.2", "marshmallow>=3.26.0", "matplotlib>=3.10.0", "mdurl>=0.1.2", "mean-average-precision>=2021.4.26.0", "mpire>=2.10.2", "mpmath>=1.3.0", "multiprocess>=0.70.17", "mypy-extensions>=1.0.0", "networkx>=3.4.2", "netwulf>=0.1.5", "ninja>=1.11.1.3", "numerize>=0.12", "numpy>=1.26.4", "nvidia-cublas-cu12>=12.1.3.1", "nvidia-cuda-cupti-cu12>=12.1.105", "nvidia-cuda-nvrtc-cu12>=12.1.105", "nvidia-cuda-runtime-cu12>=12.1.105", "nvidia-cudnn-cu12>=8.9.2.26", "nvidia-cufft-cu12>=11.0.2.54", "nvidia-curand-cu12>=10.3.2.106", "nvidia-cusolver-cu12>=11.4.5.107", "nvidia-cusparse-cu12>=12.1.0.106", "nvidia-nccl-cu12>=2.19.3", "nvidia-nvjitlink-cu12>=12.8.61", "nvidia-nvtx-cu12>=12.1.105", "onnxruntime>=1.20.1", "opencv-python-headless>=4.11.0.86", "openpyxl>=3.1.5", "packaging>=24.2", "pandas>=2.2.3", "pillow>=10.4.0", "platformdirs>=4.3.6", "pluggy>=1.5.0", "protobuf>=5.29.3", "pyclipper>=1.3.0.post6", "pydantic>=2.10.5", "pydantic-core>=2.27.2", "pydantic-settings>=2.7.1", "pygments>=2.19.1", "pypa